{{define "content"}}
<div class="auth">
  <h1>Sign in</h1>
  <p class="muted">Aircoins MikroTik hotspot controller</p>

  <form method="post" action="/admin/login" class="card form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <label>
      <span>Username</span>
      <input type="text" name="username" value="{{with .Data}}{{.Username}}{{end}}" autocomplete="username" autofocus required>
    </label>

    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    {{with .Data}}{{if .Error}}<div class="flash error" role="alert">{{.Error}}</div>{{end}}{{end}}

    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{{end}}
