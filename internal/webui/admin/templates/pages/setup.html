{{define "content"}}
<div class="auth">
  <h1>First run setup</h1>
  <p class="muted">
    Create the administrator account for this panel. Router credentials are stored
    encrypted with a master key kept beside the database.
  </p>

  <form method="post" action="/admin/setup" class="card form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <label>
      <span>Username</span>
      <input type="text" name="username" value="{{with .Data}}{{.Username}}{{end}}" autocomplete="username" autofocus required>
    </label>

    <label>
      <span>Password <em class="muted">(minimum 10 characters)</em></span>
      <input type="password" name="password" autocomplete="new-password" required minlength="10">
    </label>

    <label>
      <span>Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" required minlength="10">
    </label>

    {{with .Data}}{{if .Error}}<div class="flash error" role="alert">{{.Error}}</div>{{end}}{{end}}

    <button class="btn btn-primary" type="submit">Create administrator</button>
  </form>
</div>
{{end}}
