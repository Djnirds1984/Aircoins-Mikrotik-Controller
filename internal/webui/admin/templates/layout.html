{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Aircoins</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/admin/routers">
    Aircoins
    <span>MikroTik hotspot controller</span>
  </a>
  {{if .Admin}}
  <nav class="nav">
    <a href="/admin/routers"{{if eq .Nav "routers"}} class="active"{{end}}>Routers</a>
  </nav>
  <div class="user">
    <span class="who">{{.Admin.Username}}</span>
    <span class="role">{{.Admin.RoleLabel}}</span>
    <form method="post" action="/admin/logout" class="inline">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button class="btn btn-ghost" type="submit">Sign out</button>
    </form>
  </div>
  {{end}}
</header>

<main class="wrap">
  {{if .Flash}}<div class="flash {{.Flash.Kind}}" role="status">{{.Flash.Message}}</div>{{end}}
  {{template "content" .}}
</main>

<footer class="foot">
  <span>Aircoins MikroTik hotspot controller</span>
  <span class="muted">build {{.Version}}</span>
</footer>

<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
